# Keeps the three dependency surfaces from silently accumulating CVEs the way
# Spring Boot 3.3.4 did (~22 months stale by the time the first Trivy scan ran).
# Grouped weekly PRs; CI (build.yml) gates them like any other PR.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The base images are DELIBERATE, COUPLED choices — never auto-bump majors:
      # the runtime JDK must be one the shipped Gradle can run on (Gradle 8.x
      # cannot run on JDK 25; that pairing broke the agent's in-container
      # self-build when auto-merged once), and a Gradle major changes the
      # distribution copied into the runtime image. Bump them together, on
      # purpose, with a ship-check.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      - dependency-name: gradle
        update-types: ["version-update:semver-major"]
